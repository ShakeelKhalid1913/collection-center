# Health LMS Pro — Render Blueprint
#
# DB_HOST must be the MySQL private service INTERNAL hostname from
# Dashboard → mysql service → Connect → Internal (e.g. mysql-xxxx),
# NOT the bare word "mysql".
#
# Same region as MySQL (Oregon). Free web services can SEND private traffic.

services:
  - type: web
    name: health-lms-pro
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - fromGroup: mysql
      # Override these in the dashboard with Connect → Internal values
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: mysql
      - key: DB_USER
        value: mysql
      - key: DB_PASS
        sync: false
